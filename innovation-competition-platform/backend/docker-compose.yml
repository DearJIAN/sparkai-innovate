services:
  my-keshe-backend:
    build:
      context: /data/my-keshe/backend
      dockerfile: Dockerfile
    container_name: my-keshe-backend
    restart: unless-stopped
    env_file:
      - /data/my-keshe/backend/.env
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
      UPLOAD_FOLDER: /data/my-keshe/uploads
      CORS_ORIGINS: http://47.93.3.71,http://47.93.3.71/spark,http://47.93.3.71:80,http://localhost:5173,http://127.0.0.1:5173
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /data/my-keshe/uploads:/data/my-keshe/uploads
      - /data/my-keshe/backend/.env:/app/.env:ro
